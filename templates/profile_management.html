<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Settings | Power Alert</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header>
        <h2><i class="fas fa-user-gear"></i> Settings</h2>
        <a href="{{ url_for('index') }}" style="text-decoration: none; color: var(--primary-blue); font-weight: bold;">
            <i class="fas fa-arrow-left"></i> Back
        </a>
    </header>

    <div class="container">
        <div class="info-box">
            <i class="fas fa-info-circle"></i> Signed in as: <strong>{{ user.email }}</strong>
        </div>

        <form id="profileUpdateForm">
            <div style="margin-bottom: 30px;">
                <h3><i class="fas fa-envelope-open-text"></i> Notifications</h3>
                <div class="form-group" style="background: #f9f9f9; padding: 15px; border-radius: 12px; display: flex; align-items: center; gap: 10px;">
                    <input type="checkbox" id="isSubscribed" name="isSubscribed" style="width: 20px; height: 20px;" {% if user.is_subscribed %}checked{% endif %}>
                    <label for="isSubscribed" style="margin: 0;">Receive automated email alerts</label>
                </div>
            </div>

            <div style="margin-bottom: 30px;">
                <h3><i class="fas fa-map-location-dot"></i> Home Location</h3>
                <p style="font-size: 0.85rem; color: var(--text-muted);">This location determines which alerts you receive.</p>
                
                <div class="current-coords">
                    <i class="fas fa-satellite"></i> GPS: 
                    <span id="currentLat">{{ user.latitude or '---' }}</span>, 
                    <span id="currentLon">{{ user.longitude or '---' }}</span>
                </div>
                
                <button type="button" id="updateLocationBtn" class="btn" style="background: var(--bg-gray); width: 100%;">
                    <i class="fas fa-location-crosshairs"></i> Fetch New Coordinates
                </button>
                <p id="coordStatus" style="font-size: 0.8rem; margin-top: 5px;"></p>
                <input type="hidden" id="latitude">
                <input type="hidden" id="longitude">
            </div>

            <div style="margin-bottom: 30px;">
                <h3><i class="fas fa-phone"></i> Contact Details</h3>
                <div class="form-group">
                    <label for="phone">Phone Number (Optional)</label>
                    <input type="tel" id="phone" value="{{ user.phone_number or '' }}" placeholder="+256 ...">
                </div>
            </div>

            <button type="submit" id="saveProfileBtn">
                <i class="fas fa-save"></i> Save All Changes
            </button>
            <p id="statusMessage" class="status-message"></p>
        </form>

        <div class="danger-section">
            <h3 style="color: var(--danger-red); margin-top: 0;"><i class="fas fa-triangle-exclamation"></i> Danger Zone</h3>
            <p style="font-size: 0.85rem;">Permanently delete your account and all saved alert locations.</p>
            <button type="button" id="deleteAccountBtn">Delete My Account</button>
        </div>
    </div>

    <script>
        const form = document.getElementById('profileUpdateForm');
        const updateLocationBtn = document.getElementById('updateLocationBtn');
        const deleteBtn = document.getElementById('deleteAccountBtn');
        const statusMessage = document.getElementById('statusMessage');
        const coordStatus = document.getElementById('coordStatus');
        const currentLatSpan = document.getElementById('currentLat');
        const currentLonSpan = document.getElementById('currentLon');
        const isSubscribedCheckbox = document.getElementById('isSubscribed');
        const phoneInput = document.getElementById('phone');

        let newLat = {{ (user.latitude or 0) | tojson }};
        let newLon = {{ (user.longitude or 0) | tojson }};

        updateLocationBtn.addEventListener('click', () => {
            coordStatus.textContent = '🛰️ Syncing with GPS...';
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    newLat = position.coords.latitude;
                    newLon = position.coords.longitude;
                    currentLatSpan.textContent = newLat.toFixed(6);
                    currentLonSpan.textContent = newLon.toFixed(6);
                    coordStatus.textContent = '✅ Location Updated';
                    coordStatus.style.color = 'var(--success-green)';
                },
                (error) => {
                    coordStatus.textContent = '❌ Failed to fetch location.';
                    coordStatus.style.color = 'var(--danger-red)';
                }
            );
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            statusMessage.textContent = 'Saving...';
            const data = {
                is_subscribed: isSubscribedCheckbox.checked,
                phone_number: phoneInput.value,
                latitude: newLat,
                longitude: newLon
            };

            try {
                const response = await fetch('/profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                statusMessage.textContent = result.message;
                statusMessage.className = "status-message " + (response.ok ? "success" : "error");
            } catch (error) {
                statusMessage.textContent = 'Network error.';
            }
        });

        deleteBtn.addEventListener('click', async () => {
            if (confirm("Delete your account permanently?")) {
                const response = await fetch('/delete_account', { method: 'POST' });
                if (response.ok) window.location.href = '/';
            }
        });
    </script>
</body>
</html>
