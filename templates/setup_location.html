<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Location | Power Alert</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"> 
    <style>
        /* Progress Indicator Styles */
        .step-wizard {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            padding: 0 10px;
        }
        .step-item {
            text-align: center;
            flex: 1;
            position: relative;
        }
        .step-item:not(:last-child):after {
            content: "";
            position: absolute;
            top: 15px;
            left: 50%;
            width: 100%;
            height: 2px;
            background: #ddd;
            z-index: -1;
        }
        .step-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #ddd;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .step-item.active .step-icon { background: var(--primary-blue); }
        .step-item.complete .step-icon { background: var(--success-green); }
        
        /* Specific page layout */
        .onboarding-card {
            text-align: center;
            padding: 20px;
        }
        .location-readout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }
        .coord-input-group {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #eee;
        }
        .coord-input-group small { color: var(--text-muted); display: block; font-size: 0.7rem; }
        .coord-input-group span { font-family: monospace; font-weight: bold; color: var(--dark-blue); }
    </style>
</head>
<body>
    <div class="container" style="max-width: 500px; margin-top: 40px;">
        <div class="onboarding-card">
            <div class="step-wizard">
                <div class="step-item complete"><div class="step-icon"><i class="fas fa-check"></i></div><div style="font-size: 0.7rem;">Account</div></div>
                <div class="step-item active"><div class="step-icon">2</div><div style="font-size: 0.7rem;">Location</div></div>
                <div class="step-item"><div class="step-icon">3</div><div style="font-size: 0.7rem;">Alerts</div></div>
            </div>

            <h2><i class="fas fa-map-marker-alt" style="color: var(--danger-red);"></i> Finish Setup</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">
                We need your coordinates to send relevant alerts to <strong>{{ session.get('email') }}</strong>.
            </p>

            <form id="locationSetupForm">
                <div class="info-box" style="text-align: left; background: #fffcf0; border-left-color: var(--power-amber);">
                    <strong>Step 1: Get GPS Position</strong>
                    <p style="margin: 5px 0 10px 0; font-size: 0.8rem;">Click below to identify your alert zone.</p>
                    <button type="button" id="getLocationManually" class="btn" style="width: 100%; background: var(--dark-blue); color: white;">
                        <i class="fas fa-crosshairs"></i> Fetch My Location
                    </button>
                </div>

                <div class="location-readout">
                    <div class="coord-input-group">
                        <small>LATITUDE</small>
                        <span id="latDisplay">0.000000</span>
                    </div>
                    <div class="coord-input-group">
                        <small>LONGITUDE</small>
                        <span id="lonDisplay">0.000000</span>
                    </div>
                </div>

                <div style="text-align: left; margin-top: 20px;">
                    <div class="form-group">
                        <label for="phone"><i class="fab fa-whatsapp"></i> WhatsApp Number (Optional)</label>
                        <input type="tel" id="phone" placeholder="e.g. +256 7xx xxxxxx">
                    </div>

                    <div class="form-group" style="display: flex; align-items: center; gap: 10px; background: #f0f7ff; padding: 12px; border-radius: 8px;">
                        <input type="checkbox" id="isSubscribed" checked style="width: 18px; height: 18px;">
                        <label for="isSubscribed" style="margin: 0; font-weight: normal; font-size: 0.85rem;">
                            Enable automated email alerts
                        </label>
                    </div>
                </div>

                <button type="submit" id="saveLocationBtn" class="btn" style="width: 100%; margin-top: 20px;" disabled>
                    Complete Setup <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div id="statusMessage" class="status-message" style="margin-top: 20px; font-weight: 500;">
                Awaiting location sync...
            </div>
        </div>
    </div>

    <script>
        const getLocationBtn = document.getElementById('getLocationManually');
        const saveBtn = document.getElementById('saveLocationBtn');
        const latDisplay = document.getElementById('latDisplay');
        const lonDisplay = document.getElementById('lonDisplay');
        const statusMessage = document.getElementById('statusMessage');
        const form = document.getElementById('locationSetupForm');
        
        let userLat = null;
        let userLon = null;

        getLocationBtn.addEventListener('click', () => {
            statusMessage.textContent = '🛰️ Syncing with satellites...';
            statusMessage.style.color = 'var(--primary-blue)';
            
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        userLat = position.coords.latitude;
                        userLon = position.coords.longitude;

                        latDisplay.textContent = userLat.toFixed(6);
                        lonDisplay.textContent = userLon.toFixed(6);

                        statusMessage.textContent = '✅ Location Verified!';
                        statusMessage.style.color = 'var(--success-green)';
                        saveBtn.disabled = false;
                        saveBtn.style.background = 'var(--success-green)';
                        saveBtn.style.color = 'white';
                    },
                    (error) => {
                        statusMessage.textContent = '❌ Access Denied. Please enable GPS.';
                        statusMessage.style.color = 'var(--danger-red)';
                    }
                );
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            saveBtn.textContent = 'Saving Preferences...';
            
            const data = {
                latitude: userLat,
                longitude: userLon,
                phone_number: document.getElementById('phone').value,
                is_subscribed: document.getElementById('isSubscribed').checked
            };

            try {
                const response = await fetch('/setup_location', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    statusMessage.textContent = '🚀 All set! Redirecting...';
                    setTimeout(() => window.location.href = '/', 1500);
                } else {
                    statusMessage.textContent = '⚠️ Error saving data.';
                    saveBtn.textContent = 'Retry Save';
                }
            } catch (err) {
                statusMessage.textContent = '📡 Connection error.';
            }
        });
    </script>
</body>
</html>
